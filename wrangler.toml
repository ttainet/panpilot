# PanPilot — Cloudflare Workers 配置
# 部署可经 scripts/deploy.py 走 Cloudflare API（非 wrangler deploy）；
# 本文件同时供本地 wrangler dev 使用。
name = "panpilot"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

# 正式域名：绑定到你自己的域名（示例：your-panpilot.example.com）。
# 一种绑定方式：域名所在 Zone 的 Worker 路由 <你的域名>/* → 本 Worker + 一条
# 橙云代理的占位 DNS A 记录。Workers 自定义域 API 对部分 Account API Token
# 会返回 10405（Method not allowed for this authentication scheme），
# 故 scripts/deploy.py 会回退到上述路由方式。
# routes = [{ pattern = "your-panpilot.example.com", custom_domain = true }]

# D1 数据库：部署前先执行
#   wrangler d1 create panpilot
# 把输出的 database_id 填到下面，并执行 migrations：
#   wrangler d1 migrations apply panpilot --remote
# 本地 `wrangler dev` 会使用本地 D1（先执行 wrangler d1 migrations apply panpilot --local）。
# 只要存在 DB binding，Worker 默认走 D1；无 binding 时才回退内存存储，
# 健康检查会如实返回 store: "d1" 或 "memory"，不会假装已连接 D1。
[[d1_databases]]
binding = "DB"
database_name = "panpilot"
database_id = "00000000-0000-0000-0000-000000000000" # 占位：部署时回填你自己的 D1 database_id
migrations_dir = "migrations"

# 密钥不要写在这里，用 wrangler secret put 注入：
#   wrangler secret put APP_USERNAME     # 网页端登录用户名
#   wrangler secret put APP_PASSWORD     # 网页端登录密码
#   wrangler secret put DRIVER_TOKEN     # Driver 的 Bearer Token（与网页登录独立）
#   wrangler secret put SESSION_SECRET   # 可选：会话 Cookie 签名密钥（默认由 APP_PASSWORD 派生）
#   wrangler secret put COOKIE_ENC_SECRET # 可选：夸克 Cookie 的 AES-GCM 加密密钥（32 字节 hex）；未设则 Cookie 功能禁用
# 本地开发把假值写进 .dev.vars（已 gitignore），不要提交真实密钥。
[vars]
CHECK_INTERVAL_HOURS = "6"
